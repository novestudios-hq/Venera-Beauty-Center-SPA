<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2">
  <meta name="description" content="اختر علاجك واحجز موعدك في مركز فينيرا للتجميل والسبا في شرم الشيخ.">
  <title>مركز فينيرا للتجميل والسبا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f6f5f2;
      --card: #fff;
      --ink: #1a1a1a;
      --muted: #777672;
      --quiet: #9b9891;
      --line: #eaeaea;
      --accent: #8b7358;
      --accent-wash: #f4f0ea;
      --cta: #1a1a1a;
      --serif-en: "Playfair Display", Georgia, serif;
      --sans-en: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif-ar: "Amiri", Georgia, serif;
      --sans-ar: "Cairo", Tahoma, Arial, sans-serif;
      --app-width: 620px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; background: var(--canvas); scroll-behavior: smooth; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% -15%, rgba(182, 161, 132, .15), transparent 34rem),
        var(--canvas);
      font-family: var(--sans-en);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, a { font: inherit; }
    button { color: inherit; }

    .app-shell {
      width: min(100%, var(--app-width));
      min-height: 100svh;
      margin: 0 auto;
      padding: 22px 28px calc(158px + env(safe-area-inset-bottom));
    }
    .topbar {
      position: relative;
      display: flex;
      min-height: 49px;
      align-items: center;
      justify-content: flex-start;
      direction: ltr;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: #6e6253;
    }
    .wordmark-symbol {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(139, 115, 88, .34);
      border-radius: 50%;
      background: rgba(255, 255, 255, .6);
      color: var(--accent);
    }
    .wordmark-symbol svg { width: 22px; height: 22px; }
    .wordmark-copy { display: grid; gap: 1px; }
    .wordmark-name { font-family: var(--serif-en); font-size: 13px; letter-spacing: .045em; }
    .wordmark-location { color: var(--quiet); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }

    .language-switch {
      position: absolute;
      top: 1px;
      right: 0;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border: 1px solid #e9e6e0;
      border-radius: 999px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 2px 8px rgba(24, 24, 22, .035);
      direction: ltr;
    }
    .language-switch button {
      min-width: 40px;
      height: 29px;
      padding: 0 9px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #77746e;
      cursor: pointer;
      font-family: var(--sans-en);
      font-size: 11px;
      font-weight: 600;
      transition: color .2s ease, background-color .2s ease, box-shadow .2s ease;
    }
    .language-switch button[aria-pressed="true"] {
      background: #1a1a1a;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .12);
      color: #fff;
    }
    .language-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .hero { padding: 51px 0 35px; text-align: start; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 17px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .18em;
      line-height: 1.5;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 25px; height: 1px; background: #bdad99; content: ""; }
    h1 {
      display: block;
      max-width: 540px;
      margin: 0;
      font-family: var(--serif-en);
      font-size: clamp(23px, 6.8vw, 40px);
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1.2;
    }
    .subtitle {
      margin: 12px 0 0;
      color: #77736d;
      font-family: var(--serif-en);
      font-size: 16px;
      font-weight: 400;
      letter-spacing: .015em;
      line-height: 1.55;
    }
    .location-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      margin-top: 23px;
      padding: 11px 14px;
      border: 1px solid rgba(226, 222, 215, .8);
      border-radius: 999px;
      background: rgba(255, 255, 255, .52);
      color: #6f6d67;
      font-size: 11px;
      line-height: 1.45;
    }
    .location-chip svg { flex: 0 0 auto; color: var(--accent); }

    .selection-section { padding-top: 13px; }
    .section-top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin: 0 1px 21px;
    }
    .section-title {
      margin: 0;
      font-family: var(--serif-en);
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -.025em;
      line-height: 1.3;
    }
    .step-label {
      padding-bottom: 3px;
      color: #99958d;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .13em;
      text-align: end;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .card-stack { display: grid; gap: 15px; }
    .experience-card {
      position: relative;
      display: block;
      width: 100%;
      padding: 21px 21px 19px;
      border: 1px solid transparent;
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 4px 15px rgba(0, 0, 0, .05);
      cursor: pointer;
      text-align: start;
      -webkit-tap-highlight-color: transparent;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background-color .22s ease;
    }
    .experience-card:hover { box-shadow: 0 8px 24px rgba(0, 0, 0, .075); transform: translateY(-2px); }
    .experience-card:active { transform: scale(.99); }
    .experience-card:focus-visible { outline: 3px solid rgba(139, 115, 88, .3); outline-offset: 3px; }
    .experience-card[aria-pressed="true"] {
      border-color: rgba(139, 115, 88, .56);
      background: linear-gradient(135deg, #fff 65%, #fcfaf7);
      box-shadow: 0 6px 20px rgba(91, 73, 51, .09), 0 0 0 2px rgba(139, 115, 88, .07);
    }
    .card-main { display: flex; align-items: flex-start; gap: 15px; }
    .service-icon {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      place-items: center;
      border-radius: 15px;
      background: var(--accent-wash);
      color: #846e54;
      transition: background-color .2s ease, color .2s ease;
    }
    .experience-card[aria-pressed="true"] .service-icon { background: #e9dfd1; color: #65513b; }
    .service-icon svg { width: 23px; height: 23px; }
    .card-copy { min-width: 0; flex: 1; padding-top: 1px; }
    .service-type {
      display: block;
      margin: 0 0 5px;
      color: #a08769;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .14em;
      line-height: 1.45;
      text-transform: uppercase;
    }
    .service-name {
      display: block;
      margin: 0;
      color: #22211f;
      font-family: var(--sans-en);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.025em;
      line-height: 1.45;
    }
    .service-description {
      display: block;
      margin: 5px 0 0;
      color: #85827c;
      font-family: var(--sans-en);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.55;
    }
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 17px;
      padding-top: 14px;
      border-top: 1px solid #f0efec;
    }
    .selection-hint {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #88857e;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
    }
    .radio-mark {
      display: grid;
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      place-items: center;
      border: 1px solid #d8d5ce;
      border-radius: 50%;
      background: #fff;
      transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease;
    }
    .radio-mark svg { width: 9px; height: 9px; opacity: 0; color: #fff; transition: opacity .18s ease; }
    .experience-card[aria-pressed="true"] .radio-mark { border-color: #7d6951; background: #7d6951; box-shadow: 0 0 0 3px rgba(125, 105, 81, .1); }
    .experience-card[aria-pressed="true"] .radio-mark svg { opacity: 1; }
    .price {
      color: #1d1c1a;
      font-family: var(--sans-en);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .sticky-action {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 20px 24px calc(19px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(231, 228, 221, .84);
      background: rgba(246, 245, 242, .91);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    .sticky-inner { width: min(100%, 572px); margin: 0 auto; }
    .action-status {
      min-height: 17px;
      margin: 0 0 9px;
      color: #85827c;
      font-size: 10px;
      line-height: 1.45;
      text-align: center;
    }
    .booking-button {
      display: flex;
      width: 100%;
      min-height: 57px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 15px 20px;
      border: 1px solid var(--cta);
      border-radius: 12px;
      background: var(--cta);
      box-shadow: 0 7px 18px rgba(0, 0, 0, .12);
      color: #fff;
      font-family: var(--sans-en);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .005em;
      text-align: center;
      text-decoration: none;
      transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .booking-button svg { flex: 0 0 auto; }
    .booking-button:hover { border-color: #353535; background: #353535; box-shadow: 0 10px 23px rgba(0, 0, 0, .17); transform: translateY(-1px); }
    .booking-button:active { transform: translateY(1px) scale(.99); }
    .booking-button:focus-visible { outline: 3px solid rgba(139, 115, 88, .35); outline-offset: 3px; }

    /* Arabic typography and mirrored reading flow. */
    .app-shell[dir="rtl"] { font-family: var(--sans-ar); }
    .app-shell[dir="rtl"] .wordmark-name,
    .app-shell[dir="rtl"] h1,
    .app-shell[dir="rtl"] .subtitle,
    .app-shell[dir="rtl"] .section-title { font-family: var(--serif-ar); font-weight: 400; letter-spacing: 0; }
    .app-shell[dir="rtl"] .wordmark-name { font-size: 16px; }
    .app-shell[dir="rtl"] .wordmark-location,
    .app-shell[dir="rtl"] .eyebrow,
    .app-shell[dir="rtl"] .service-type,
    .app-shell[dir="rtl"] .step-label { letter-spacing: 0; }
    .app-shell[dir="rtl"] .eyebrow { font-size: 12px; }
    .app-shell[dir="rtl"] h1 { font-size: clamp(31px, 8vw, 40px); line-height: 1.35; }
    .app-shell[dir="rtl"] .subtitle { font-size: 19px; }
    .app-shell[dir="rtl"] .service-name,
    .app-shell[dir="rtl"] .service-description,
    .app-shell[dir="rtl"] .price,
    .app-shell[dir="rtl"] .booking-button { font-family: var(--sans-ar); letter-spacing: 0; }
    .app-shell[dir="rtl"] .service-name { font-size: 15px; line-height: 1.55; }
    .app-shell[dir="rtl"] .service-description { font-size: 12px; }
    .app-shell[dir="rtl"] .price { font-size: 14px; }
    .app-shell[dir="rtl"] .section-title { font-size: 25px; }
    .app-shell[dir="rtl"] .step-label { font-size: 11px; }
    .app-shell[dir="rtl"] .booking-button { font-size: 15px; }
    .language-switch [lang="ar"] { font-family: var(--sans-ar); font-size: 12px; }

    @media (min-width: 640px) {
      .app-shell { padding: 29px 38px calc(166px + env(safe-area-inset-bottom)); }
      .hero { padding-top: 66px; padding-bottom: 43px; }
      .selection-section { padding-top: 18px; }
      .section-top { margin-bottom: 25px; }
      .card-stack { gap: 17px; }
      .experience-card { padding: 24px 25px 21px; }
      .service-name { font-size: 16px; }
      .sticky-action { padding-right: 30px; padding-left: 30px; }
    }
    @media (max-width: 390px) {
      .app-shell { padding-right: 21px; padding-left: 21px; }
      .hero { padding-top: 43px; }
      .experience-card { padding: 18px 17px 17px; }
      .card-main { gap: 12px; }
      .service-icon { width: 43px; height: 43px; flex-basis: 43px; border-radius: 14px; }
      .service-name { font-size: 14px; }
      .app-shell[dir="rtl"] .service-name { font-size: 14px; }
      .sticky-action { padding-right: 18px; padding-left: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell" id="app" dir="rtl">
    <div class="topbar">
      <div class="wordmark" aria-label="Venera">
        <span class="wordmark-symbol" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none">
            <path d="M14 22.5c-1.2-4.1-1.1-8.1 0-12.2 1.1 4.1 1.2 8.1 0 12.2Z" stroke="currentColor" stroke-width="1.05"/>
            <path d="M13.8 18.2c-4.7-.2-7.4-2.6-8.1-7.1 4.7.2 7.5 2.5 8.1 7.1Z" stroke="currentColor" stroke-width="1.05"/>
            <path d="M14.2 18.2c4.7-.2 7.4-2.6 8.1-7.1-4.7.2-7.5 2.5-8.1 7.1Z" stroke="currentColor" stroke-width="1.05"/>
            <path d="M14 10.4c-.1-2.6.8-4.6 2.7-6.1 1.8 2.9.9 5-2.7 6.1Z" stroke="currentColor" stroke-width="1.05"/>
          </svg>
        </span>
        <span class="wordmark-copy">
          <span class="wordmark-name">VENERA</span>
          <span class="wordmark-location" data-copy="brandLocation">SHARM EL-SHEIKH</span>
        </span>
      </div>
      <div class="language-switch" role="group" aria-label="Choose language">
        <button type="button" data-language="ar" aria-pressed="true" lang="ar">العربية</button>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
    </div>

    <header class="hero">
      <p class="eyebrow" data-copy="eyebrow">مساحة من الهدوء، مصممة لك</p>
      <h1 data-copy="title">مركز فينيرا للتجميل والسبا</h1>
      <p class="subtitle" data-copy="subtitle">علاجات حصرية وعافية متكاملة</p>
      <div class="location-chip">
        <svg width="16" height="18" viewBox="0 0 18 20" fill="none" aria-hidden="true">
          <path d="M15 8.2c0 4.7-6 10.2-6 10.2S3 12.9 3 8.2a6 6 0 1 1 12 0Z" stroke="currentColor" stroke-width="1.35"/>
          <circle cx="9" cy="8" r="1.9" stroke="currentColor" stroke-width="1.25"/>
        </svg>
        <span data-copy="address">شارع شرم ليزيه، إل ميركاتو، شرم الشيخ</span>
      </div>
    </header>

    <section class="selection-section" aria-labelledby="section-title">
      <div class="section-top">
        <h2 class="section-title" id="section-title" data-copy="sectionTitle">اختاري علاجك</h2>
        <span class="step-label" data-copy="step">الخطوة ١ من ٢ · اختاري علاجاً</span>
      </div>

      <div class="card-stack" role="group" aria-label="العلاجات المتاحة">
        <button type="button" class="experience-card" data-treatment="eye" aria-pressed="false">
          <span class="card-main">
            <span class="service-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M3.4 12s3.1-5 8.6-5 8.6 5 8.6 5-3.1 5-8.6 5-8.6-5-8.6-5Z" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.55" stroke="currentColor" stroke-width="1.4"/><path d="M5.2 6.1 4 4.8m14.8 1.3L20 4.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </span>
            <span class="card-copy">
              <span class="service-type" data-copy="eyeType">عناية متقدمة بالعين</span>
              <span class="service-name" data-copy="eyeTitle">علاج زيميتس لمنطقة العين</span>
              <span class="service-description" data-copy="eyeDescription">تجديد متقدم وشدّ للبشرة.</span>
            </span>
          </span>
          <span class="card-bottom">
            <span class="selection-hint"><span class="radio-mark" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m2.2 6.2 2.4 2.3 5.2-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span data-copy="selectHint">اختاري هذا العلاج</span></span>
            <span class="price" data-price="eye">١٬٢٠٠ ج.م</span>
          </span>
        </button>

        <button type="button" class="experience-card" data-treatment="facial" aria-pressed="false">
          <span class="card-main">
            <span class="service-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.8c-3.6 0-6.3 2.7-6.3 6.4v3.1c0 3.8 2.7 6.9 6.3 6.9s6.3-3.1 6.3-6.9v-3.1c0-3.7-2.7-6.4-6.3-6.4Z" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 11.3h.01m7 0h.01M9.7 15.2c1.4 1.1 3.2 1.1 4.6 0M4.7 7.8c-.8.7-1.2 1.6-1.2 2.8m16.1-2.8c.8.7 1.2 1.6 1.2 2.8" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
            </span>
            <span class="card-copy">
              <span class="service-type" data-copy="facialType">طقوس العناية بالبشرة</span>
              <span class="service-name" data-copy="facialTitle">تروبيك سكين كير لتنظيف الوجه بعمق</span>
              <span class="service-description" data-copy="facialDescription">عناية عضوية لتنظيف عميق وإشراقة طبيعية.</span>
            </span>
          </span>
          <span class="card-bottom">
            <span class="selection-hint"><span class="radio-mark" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m2.2 6.2 2.4 2.3 5.2-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span data-copy="selectHint">اختاري هذا العلاج</span></span>
            <span class="price" data-price="facial">١٬٨٠٠ ج.م</span>
          </span>
        </button>

        <button type="button" class="experience-card" data-treatment="body" aria-pressed="false">
          <span class="card-main">
            <span class="service-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 20.3c-1.3-3.8-1.4-7.7 0-11.8 1.4 4.1 1.3 8 0 11.8Z" stroke="currentColor" stroke-width="1.35"/><path d="M11.7 16.4c-4.5-.1-7.1-2.3-7.8-6.6 4.6.2 7.2 2.4 7.8 6.6Zm.6 0c4.5-.1 7.1-2.3 7.8-6.6-4.6.2-7.2 2.4-7.8 6.6Z" stroke="currentColor" stroke-width="1.35"/><path d="M12 8.5c-.1-2.1.7-3.7 2.2-4.9 1.5 2.3.8 4-2.2 4.9Z" stroke="currentColor" stroke-width="1.35"/></svg>
            </span>
            <span class="card-copy">
              <span class="service-type" data-copy="bodyType">جلسة استرخاء للجسم</span>
              <span class="service-name" data-copy="bodyTitle">جلسة سبا متكاملة للجسم</span>
              <span class="service-description" data-copy="bodyDescription">١٠٠ دقيقة من الاسترخاء التام.</span>
            </span>
          </span>
          <span class="card-bottom">
            <span class="selection-hint"><span class="radio-mark" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m2.2 6.2 2.4 2.3 5.2-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span data-copy="selectHint">اختاري هذا العلاج</span></span>
            <span class="price" data-price="body">٢٬٠٠٠ ج.م</span>
          </span>
        </button>

        <button type="button" class="experience-card" data-treatment="hair" aria-pressed="false">
          <span class="card-main">
            <span class="service-icon" aria-hidden="true">

  <script>
    (() => {
      const copy = {
        ar: {
          title: 'مركز فينيرا للتجميل والسبا',
          subtitle: 'علاجات حصرية وعافية متكاملة',
          address: 'شارع شرم ليزيه، إل ميركاتو، شرم الشيخ',
          eyebrow: 'مساحة من الهدوء، مصممة لك',
          brandLocation: 'شرم الشيخ',
          sectionTitle: 'اختاري علاجك',
          step: 'الخطوة ١ من ٢ · اختاري علاجاً',
          treatmentsLabel: 'العلاجات المتاحة',
          selectHint: 'اختاري هذا العلاج',
          eyeType: 'عناية متقدمة بالعين',
          eyeTitle: 'علاج زيميتس لمنطقة العين',
          eyeDescription: 'تجديد متقدم وشدّ للبشرة.',
          facialType: 'طقوس العناية بالبشرة',
          facialTitle: 'تروبيك سكين كير لتنظيف الوجه بعمق',
          facialDescription: 'عناية عضوية لتنظيف عميق وإشراقة طبيعية.',
          bodyType: 'جلسة استرخاء للجسم',
          bodyTitle: 'جلسة سبا متكاملة للجسم',
          bodyDescription: '١٠٠ دقيقة من الاسترخاء التام.',
          hairType: 'استوديو الشعر',
          hairTitle: 'صبغة وتصفيف شعر فاخر',
          hairDescription: 'اختيار لون باحترافية وعناية متكاملة.',
          cta: 'اطلب حجزك عبر ماسنجر',
          chooseStatus: 'اختاري علاجاً للمتابعة إلى الحجز',
          selectedStatus: 'تم اختيار: {treatment}',
          ctaLabel: 'اطلب حجزك عبر ماسنجر',
          prices: { eye: '١٬٢٠٠ ج.م', facial: '١٬٨٠٠ ج.م', body: '٢٬٠٠٠ ج.م', hair: '٢٬٥٠٠ ج.م' },
          treatments: { eye: 'علاج زيميتس لمنطقة العين', facial: 'تروبيك سكين كير لتنظيف الوجه بعمق', body: 'جلسة سبا متكاملة للجسم', hair: 'صبغة وتصفيف شعر فاخر' }
        },
        en: {
          title: 'Venera Beauty Center & SPA',
          subtitle: 'Exclusive Treatments & Wellness',
          address: 'Sharm Elysee St. il Mercato, Sharm el-Sheikh',
          eyebrow: 'A quieter kind of luxury',
          brandLocation: 'SHARM EL-SHEIKH',
          sectionTitle: 'Choose your treatment',
          step: 'STEP 1 OF 2 · SELECT A TREATMENT',
          treatmentsLabel: 'Available treatments',
          selectHint: 'Select this treatment',
          eyeType: 'ADVANCED EYE CARE',
          eyeTitle: 'Zemits Eye Treatment',
          eyeDescription: 'Advanced rejuvenation and firming.',
          facialType: 'SKINCARE RITUAL',
          facialTitle: 'Tropic Skincare Deep Facial',
          facialDescription: 'Organic deep cleansing for a natural glow.',
          bodyType: 'BODY WELLNESS',
          bodyTitle: 'Signature Full Body Spa',
          bodyDescription: '100 minutes of pure relaxation.',
          hairType: 'HAIR STUDIO',
          hairTitle: 'Premium Hair Color & Styling',
          hairDescription: 'Expert color matching and care.',
          cta: 'Request Booking via Messenger',
          chooseStatus: 'Select a treatment to continue to booking',
          selectedStatus: 'Selected: {treatment}',
          ctaLabel: 'Request booking via Messenger',
          prices: { eye: '1,200 EGP', facial: '1,800 EGP', body: '2,000 EGP', hair: '2,500 EGP' },
          treatments: { eye: 'Zemits Eye Treatment', facial: 'Tropic Skincare Deep Facial', body: 'Signature Full Body Spa', hair: 'Premium Hair Color & Styling' }
        }
      };

      const app = document.getElementById('app');
      const status = document.getElementById('action-status');
      const bookingLink = document.querySelector('.booking-button');
      const cardStack = document.querySelector('.card-stack');
      const languageButtons = document.querySelectorAll('[data-language]');
      const treatmentCards = document.querySelectorAll('.experience-card');
      let language = 'ar';
      let selected = null;

      function renderLanguage(nextLanguage) {
        language = nextLanguage;
        const strings = copy[language];
        const rtl = language === 'ar';
        document.documentElement.lang = language;
        document.documentElement.dir = rtl ? 'rtl' : 'ltr';
        document.title = strings.title;
        app.dir = rtl ? 'rtl' : 'ltr';
        app.setAttribute('aria-label', strings.title);
        cardStack.setAttribute('aria-label', strings.treatmentsLabel);

        document.querySelectorAll('[data-copy]').forEach((element) => {
          const key = element.dataset.copy;
          if (strings[key] !== undefined) element.textContent = strings[key];
        });
        document.querySelectorAll('[data-price]').forEach((element) => {
          element.textContent = strings.prices[element.dataset.price];
          element.dir = rtl ? 'rtl' : 'ltr';
        });
        languageButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.language === language));
        });
        bookingLink.setAttribute('aria-label', strings.ctaLabel);
        updateStatus();
      }

      function updateStatus() {
        if (!selected) {
          status.textContent = copy[language].chooseStatus;
          return;
        }
        status.textContent = copy[language].selectedStatus.replace('{treatment}', copy[language].treatments[selected]);
      }

      languageButtons.forEach((button) => {
        button.addEventListener('click', () => renderLanguage(button.dataset.language));
      });
      treatmentCards.forEach((card) => {
        card.addEventListener('click', () => {
          selected = card.dataset.treatment;
          treatmentCards.forEach((item) => {
            const isSelected = item === card;
            item.setAttribute('aria-pressed', String(isSelected));
          });
          updateStatus();
        });
      });
      renderLanguage('ar');
    })();
  </script>
</body>
</html>
